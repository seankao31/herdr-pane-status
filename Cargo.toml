[package]
name = "herdr-pane-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "herdr plugin: marks the panes whose agent finished or needs you, until you look at them"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
